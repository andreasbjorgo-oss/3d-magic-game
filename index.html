<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Magic Battle Royale</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111122;
}

#gameContainer {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#ui {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #00ffff;
    font-size: 14px;
    z-index: 100;
    font-weight: bold;
    text-shadow: 0 0 10px #00ffff;
}

#healthBar {
    width: 120px;
    height: 12px;
    border: 2px solid #00ffff;
    background: #111;
    margin-top: 3px;
    border-radius: 3px;
    overflow: hidden;
}

#health {
    height: 100%;
    background: linear-gradient(90deg, #00ff00, #ffff00);
    width: 100%;
}

#stats {
    margin-top: 8px;
    font-size: 11px;
    color: #ffaa00;
}

#score {
    position: fixed;
    top: 10px;
    right: 10px;
    color: #ffff00;
    font-size: 16px;
    z-index: 100;
    text-shadow: 0 0 10px #ffff00;
}

#playersLeft {
    position: fixed;
    top: 40px;
    right: 10px;
    color: #ff6666;
    font-size: 14px;
    z-index: 100;
    text-shadow: 0 0 10px #ff6666;
}

#zoneInfo {
    position: fixed;
    top: 70px;
    right: 10px;
    color: #ff9900;
    font-size: 12px;
    z-index: 100;
    text-shadow: 0 0 10px #ff9900;
}

#controls {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ffff;
    font-size: 11px;
    text-align: center;
    z-index: 100;
}

#minimap {
    position: fixed;
    bottom: 15px;
    right: 15px;
    width: 120px;
    height: 120px;
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #00ffff;
    z-index: 100;
}

#minimapCanvas {
    width: 100%;
    height: 100%;
}

#gameOver {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.95);
    color: #ff0000;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    z-index: 200;
    display: none;
    border: 3px solid #ff0000;
}

#gameOver h1 {
    font-size: 24px;
    margin-bottom: 15px;
}

#gameOver p {
    font-size: 16px;
    margin: 8px 0;
    color: #ffff00;
}

#gameOver button {
    margin-top: 15px;
    padding: 8px 16px;
    font-size: 14px;
    background: #00ffff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: #000;
}

#zoneWarning {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ff3333;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff3333;
    z-index: 50;
    pointer-events: none;
    display: none;
}
</style>
</head>
<body>

<div id="gameContainer"></div>

<div id="ui">
    <div>❤️ Helse:</div>
    <div id="healthBar"><div id="health"></div></div>
    <div id="stats">Kills: 0 | Level: 1</div>
</div>

<div id="score">👥 Poeng: 0</div>
<div id="playersLeft">Spillere igjen: 50</div>
<div id="zoneInfo">Zone: Sikker</div>
<div id="controls">Dra = Beveg | Trykk = Skyt | 1/2/3 = Magi</div>

<canvas id="minimapCanvas"></canvas>
<div id="minimap">
    <canvas id="minimapCanvas" style="display: none;"></canvas>
</div>

<div id="zoneWarning">⚠️ ZONE LUKKER!</div>

<div id="gameOver">
    <h1>GAME OVER!</h1>
    <p id="finalScore">Poeng: 0</p>
    <p id="placement">Plassering: --</p>
    <button onclick="location.reload()">Spill igjen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene setup
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.y = 5;
camera.position.z = 12;

let renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "low-power" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.getElementById('gameContainer').appendChild(renderer.domElement);

// Lighting
let light = new THREE.DirectionalLight(0xffffff, 1.0);
light.position.set(20, 30, 20);
scene.add(light);

let ambientLight = new THREE.AmbientLight(0x666666, 0.8);
scene.add(ambientLight);

// BATTLE ROYALE ZONE SYSTEM
const MAP_SIZE = 200;
const INITIAL_ZONE_RADIUS = 90;
const FINAL_ZONE_RADIUS = 10;
const ZONE_DAMAGE = 5;
const ZONE_SHRINK_TIME = 60000; // 60 seconds between shrinks

let zoneCenter = new THREE.Vector2(0, 0);
let currentZoneRadius = INITIAL_ZONE_RADIUS;
let nextZoneRadius = INITIAL_ZONE_RADIUS;
let zoneTimer = 0;
let zoneShrinkInterval = ZONE_SHRINK_TIME;
let zonePhase = 0;

// Ground
let groundGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
let groundMat = new THREE.MeshLambertMaterial({color: 0x1a1a2e});
let ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Grid
let gridHelper = new THREE.GridHelper(MAP_SIZE, 20, 0x444455, 0x222233);
scene.add(gridHelper);

// Zone visualization (red circle)
let zoneGeo = new THREE.CircleGeometry(INITIAL_ZONE_RADIUS, 64);
let zoneMat = new THREE.MeshBasicMaterial({
    color: 0xff3333,
    transparent: true,
    opacity: 0.1
});
let zoneVisual = new THREE.Mesh(zoneGeo, zoneMat);
zoneVisual.rotation.x = -Math.PI / 2;
zoneVisual.position.y = 0.01;
scene.add(zoneVisual);

// Player
let playerGroup = new THREE.Group();
playerGroup.position.y = 1;
scene.add(playerGroup);

let playerBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16),
    new THREE.MeshPhongMaterial({color: 0x00ffff, emissive: 0x003333})
);
playerGroup.add(playerBody);

let playerHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 16),
    new THREE.MeshPhongMaterial({color: 0x00ffff, emissive: 0x003333})
);
playerHead.position.y = 1.2;
playerGroup.add(playerHead);

// Gloves
let leftGlove = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 12, 12),
    new THREE.MeshPhongMaterial({color: 0xff5500, emissive: 0xff5500})
);
leftGlove.position.set(-0.5, 0.3, -0.3);
playerGroup.add(leftGlove);

let rightGlove = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 12, 12),
    new THREE.MeshPhongMaterial({color: 0x00aaff, emissive: 0x00aaff})
);
rightGlove.position.set(0.5, 0.3, -0.3);
playerGroup.add(rightGlove);

// Game variables
let playerHealth = 100;
let playerMaxHealth = 100;
let score = 0;
let kills = 0;
let level = 1;
let selectedSpell = 'FIRE';
let spellCooldown = 0;
let totalPlayers = 50;
let playersAlive = 50;
let gameOver = false;

const SPELL_TYPES = {
    FIRE: { color: 0xff5500, speed: 0.5, damage: 20, range: 35, size: 0.5, name: 'ILDMAGI', emissive: 0xff8800 },
    FROST: { color: 0x00aaff, speed: 0.4, damage: 15, range: 30, size: 0.5, freezeTime: 100, name: 'FROSTMAGI', emissive: 0x00ccff },
    LIGHTNING: { color: 0xffff00, speed: 0.6, damage: 30, range: 45, size: 0.45, name: 'LYNNMAGI', emissive: 0xffff00 }
};

let spells = [];
let enemies = [];

class Enemy {
    constructor(x, z) {
        this.health = 30;
        this.maxHealth = 30;
        this.speed = 0.1;
        this.frozen = 0;
        this.targetPlayer = null;
        this.attackCooldown = 0;
        
        let geo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 12);
        let hue = Math.random();
        let color = new THREE.Color().setHSL(hue, 0.8, 0.5);
        let mat = new THREE.MeshPhongMaterial({color: color, emissive: new THREE.Color().setHSL(hue, 0.8, 0.25)});
        this.mesh = new THREE.Mesh(geo, mat);
        this.mesh.position.set(x, 0.6, z);
        scene.add(this.mesh);
        
        let head = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 12, 12),
            new THREE.MeshPhongMaterial({color: color})
        );
        head.position.y = 1;
        this.mesh.add(head);
    }
    
    update() {
        // Check if outside zone
        let distToZone = Math.sqrt(this.mesh.position.x ** 2 + this.mesh.position.z ** 2);
        if (distToZone > currentZoneRadius) {
            this.health = -1; // Die
            return;
        }
        
        if (this.frozen > 0) {
            this.frozen--;
            this.mesh.material.color.setHSL(0.6, 1, 0.5);
            return;
        }
        
        let dx = playerGroup.position.x - this.mesh.position.x;
        let dz = playerGroup.position.z - this.mesh.position.z;
        let dist = Math.sqrt(dx*dx + dz*dz);
        
        if (dist > 0.5) {
            this.mesh.position.x += (dx / dist) * this.speed;
            this.mesh.position.z += (dz / dist) * this.speed;
        } else {
            if (this.attackCooldown <= 0) {
                playerHealth -= 5;
                this.attackCooldown = 30;
            }
            this.attackCooldown--;
        }
    }
    
    takeDamage(damage) {
        this.health -= damage;
    }
    
    freeze() {
        this.frozen = SPELL_TYPES.FROST.freezeTime;
    }
    
    remove() {
        scene.remove(this.mesh);
    }
}

function spawnEnemy() {
    let angle = Math.random() * Math.PI * 2;
    let distance = Math.random() * (currentZoneRadius - 5) + 5;
    let x = Math.cos(angle) * distance;
    let z = Math.sin(angle) * distance;
    enemies.push(new Enemy(x, z));
}

function castSpell(dirX, dirZ) {
    if (spellCooldown > 0) return;
    
    let spellData = SPELL_TYPES[selectedSpell];
    
    let spell = new THREE.Mesh(
        new THREE.SphereGeometry(spellData.size, 16, 16),
        new THREE.MeshPhongMaterial({
            color: spellData.color, 
            emissive: spellData.emissive,
            wireframe: false
        })
    );
    
    spell.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z);
    
    let dist = Math.sqrt(dirX*dirX + dirZ*dirZ);
    if (dist > 0) {
        spell.velocity = new THREE.Vector3(dirX / dist, 0, dirZ / dist).multiplyScalar(spellData.speed);
    } else {
        spell.velocity = new THREE.Vector3(0, 0, -spellData.speed);
    }
    
    spell.type = selectedSpell;
    spell.damage = spellData.damage;
    spell.range = spellData.range;
    spell.traveled = 0;
    
    scene.add(spell);
    spells.push(spell);
    spellCooldown = 30;
}

function updateGloveColor() {
    let colors = { FIRE: 0xff5500, FROST: 0x00aaff, LIGHTNING: 0xffff00 };
    let emissives = { FIRE: 0xff8800, FROST: 0x00ccff, LIGHTNING: 0xffff00 };
    
    leftGlove.material.color.set(colors[selectedSpell]);
    leftGlove.material.emissive.set(emissives[selectedSpell]);
    rightGlove.material.color.set(colors[selectedSpell]);
    rightGlove.material.emissive.set(emissives[selectedSpell]);
}

function updateZone() {
    zoneTimer += 1;
    
    if (zoneTimer > zoneShrinkInterval) {
        zonePhase++;
        zoneTimer = 0;
        
        // Calculate new zone
        nextZoneRadius = Math.max(FINAL_ZONE_RADIUS, currentZoneRadius * 0.6);
        zoneShrinkInterval = ZONE_SHRINK_TIME * (1 - zonePhase * 0.1);
        
        // Random center shift
        let angle = Math.random() * Math.PI * 2;
        let shift = (currentZoneRadius - nextZoneRadius) * 0.5;
        zoneCenter.x += Math.cos(angle) * shift;
        zoneCenter.y += Math.sin(angle) * shift;
    }
    
    // Smoothly shrink zone
    let progress = zoneTimer / zoneShrinkInterval;
    currentZoneRadius = THREE.MathUtils.lerp(nextZoneRadius, currentZoneRadius, Math.max(0, 1 - progress));
    
    zoneVisual.scale.set(currentZoneRadius / INITIAL_ZONE_RADIUS, 1, currentZoneRadius / INITIAL_ZONE_RADIUS);
    zoneVisual.position.set(zoneCenter.x, 0.01, zoneCenter.y);
    
    // Check if player is outside zone
    let playerDistToZone = Math.sqrt(playerGroup.position.x ** 2 + playerGroup.position.z ** 2);
    if (playerDistToZone > currentZoneRadius) {
        playerHealth -= ZONE_DAMAGE;
        document.getElementById('zoneWarning').style.display = 'block';
        setTimeout(() => {
            document.getElementById('zoneWarning').style.display = 'none';
        }, 2000);
    }
}

// Touch controls
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
});

document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    let deltaX = e.touches[0].clientX - touchStartX;
    let deltaY = e.touches[0].clientY - touchStartY;
    let dist = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
    
    if (dist > 30) {
        let angle = Math.atan2(deltaX, deltaY);
        playerGroup.position.x += Math.sin(angle) * 0.2;
        playerGroup.position.z += Math.cos(angle) * 0.2;
        
        // Clamp to map
        playerGroup.position.x = Math.max(-MAP_SIZE/2, Math.min(MAP_SIZE/2, playerGroup.position.x));
        playerGroup.position.z = Math.max(-MAP_SIZE/2, Math.min(MAP_SIZE/2, playerGroup.position.z));
    }
});

document.addEventListener('touchend', (e) => {
    if (Date.now() - touchStartTime < 200) {
        let dirX = e.changedTouches[0].clientX - window.innerWidth/2;
        let dirZ = e.changedTouches[0].clientY - window.innerHeight/2;
        castSpell(dirX, dirZ);
    }
});

// Keyboard
document.addEventListener('keydown', (e) => {
    if (e.key === "ArrowLeft") playerGroup.position.x -= 0.5;
    if (e.key === "ArrowRight") playerGroup.position.x += 0.5;
    if (e.key === "ArrowUp") playerGroup.position.z -= 0.5;
    if (e.key === "ArrowDown") playerGroup.position.z += 0.5;
    if (e.key === "1") { selectedSpell = "FIRE"; updateGloveColor(); }
    if (e.key === "2") { selectedSpell = "FROST"; updateGloveColor(); }
    if (e.key === "3") { selectedSpell = "LIGHTNING"; updateGloveColor(); }
    if (e.key === " ") castSpell(0, -1);
});

// Minimap
function updateMinimap() {
    let minimapCanvas = document.getElementById('minimapCanvas');
    if (!minimapCanvas) return;
    
    let ctx = minimapCanvas.getContext('2d');
    let scale = 120 / MAP_SIZE;
    
    ctx.fillStyle = '#111122';
    ctx.fillRect(0, 0, 120, 120);
    
    // Draw zone
    ctx.fillStyle = 'rgba(255, 50, 50, 0.3)';
    ctx.beginPath();
    ctx.arc(60, 60, currentZoneRadius * scale, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw player
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(58, 58, 4, 4);
    
    // Draw enemies
    ctx.fillStyle = '#ff6666';
    enemies.forEach(enemy => {
        let x = 60 + enemy.mesh.position.x * scale;
        let y = 60 + enemy.mesh.position.z * scale;
        ctx.fillRect(x - 2, y - 2, 4, 4);
    });
    
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, 120, 120);
}

// Game loop
let spawnTimer = 0;
let spawnRate = 100;

function animate() {
    requestAnimationFrame(animate);
    
    if (!gameOver) {
        updateZone();
        
        spawnTimer++;
        if (spawnTimer > spawnRate && enemies.length < playersAlive - 1) {
            spawnEnemy();
            spawnTimer = 0;
            spawnRate = Math.max(40, spawnRate - 0.5);
        }
        
        camera.position.x = playerGroup.position.x * 0.8;
        camera.position.z = playerGroup.position.z + 12;
        camera.lookAt(playerGroup.position);
        
        // Update spells
        for (let i = spells.length - 1; i >= 0; i--) {
            let spell = spells[i];
            spell.position.add(spell.velocity);
            spell.traveled += spell.velocity.length();
            spell.rotation.x += 0.1;
            spell.rotation.y += 0.1;
            
            if (spell.traveled > spell.range) {
                scene.remove(spell);
                spells.splice(i, 1);
                continue;
            }
            
            for (let j = enemies.length - 1; j >= 0; j--) {
                let enemy = enemies[j];
                if (spell.position.distanceTo(enemy.mesh.position) < 1.5) {
                    enemy.takeDamage(spell.damage);
                    if (spell.type === 'FROST') enemy.freeze();
                    if (enemy.health <= 0) {
                        enemy.remove();
                        enemies.splice(j, 1);
                        score += 10;
                        kills++;
                        level = Math.floor(kills / 5) + 1;
                        playersAlive--;
                    }
                    scene.remove(spell);
                    spells.splice(i, 1);
                    break;
                }
            }
        }
        
        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].update();
            if (enemies[i].health <= 0) {
                enemies[i].remove();
                enemies.splice(i, 1);
                playersAlive--;
            }
        }
        
        spellCooldown = Math.max(0, spellCooldown - 1);
        
        // Update UI
        document.getElementById('health').style.width = (playerHealth / playerMaxHealth * 100) + '%';
        document.getElementById('stats').textContent = `Kills: ${kills} | Level: ${level}`;
        document.getElementById('score').textContent = `👥 Poeng: ${score}`;
        document.getElementById('playersLeft').textContent = `Spillere igjen: ${playersAlive}`;
        document.getElementById('zoneInfo').textContent = `Zone: ${zonePhase} | Radius: ${Math.round(currentZoneRadius)}`;
        
        updateMinimap();
        
        if (playerHealth <= 0) {
            gameOver = true;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = `Poeng: ${score}`;
            document.getElementById('placement').textContent = `Plassering: #${playersAlive + 1}`;
        }
    }
    
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start with some enemies
for (let i = 0; i < 10; i++) {
    setTimeout(() => spawnEnemy(), i * 500);
}
</script>

</body>
</html>
