<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Magic Gloves Game</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111122;
}

#gameContainer {
    width: 100%;
    height: 100%;
    position: relative;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#ui {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #00ffff;
    font-size: 16px;
    z-index: 100;
    font-weight: bold;
    text-shadow: 0 0 10px #00ffff;
}

#healthBar {
    width: 120px;
    height: 15px;
    border: 2px solid #00ffff;
    background: #111;
    margin-top: 5px;
    border-radius: 3px;
    overflow: hidden;
}

#health {
    height: 100%;
    background: linear-gradient(90deg, #00ff00, #ffff00);
    width: 100%;
}

#spellCooldown {
    margin-top: 8px;
    font-size: 12px;
    color: #ffaa00;
}

#score {
    position: fixed;
    top: 10px;
    right: 10px;
    color: #ffff00;
    font-size: 18px;
    z-index: 100;
    text-shadow: 0 0 10px #ffff00;
}

#spellIndicator {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #ffaa00;
    font-size: 12px;
    text-align: center;
    z-index: 100;
}

#controls {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ffff;
    font-size: 12px;
    text-align: center;
    z-index: 100;
}

#gameOver {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.95);
    color: #ff0000;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    z-index: 200;
    display: none;
    border: 3px solid #ff0000;
}

#gameOver h1 {
    font-size: 24px;
    margin-bottom: 15px;
}

#gameOver p {
    font-size: 16px;
    margin: 8px 0;
    color: #ffff00;
}

#gameOver button {
    margin-top: 15px;
    padding: 8px 16px;
    font-size: 14px;
    background: #00ffff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: #000;
}
</style>
</head>
<body>

<div id="gameContainer"></div>

<div id="ui">
    <div>Helse:</div>
    <div id="healthBar"><div id="health"></div></div>
    <div id="spellCooldown">Magi: 100%</div>
</div>

<div id="score">Poeng: 0</div>
<div id="spellIndicator">ILDMAGI 🔴 | FROSTMAGI 🔵 | LYNNMAGI ⚡</div>
<div id="controls">Dra = Beveg | Trykk = Skyt</div>

<div id="gameOver">
    <h1>GAME OVER!</h1>
    <p id="finalScore">Poeng: 0</p>
    <button onclick="location.reload()">Spill igjen</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene setup
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);
scene.fog = new THREE.Fog(0x111122, 100, 200);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.y = 5;
camera.position.z = 12;

let renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "low-power" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.getElementById('gameContainer').appendChild(renderer.domElement);

// Lighting
let light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(20, 30, 20);
scene.add(light);

let ambientLight = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambientLight);

// Ground
let groundGeo = new THREE.PlaneGeometry(100, 100);
let groundMat = new THREE.MeshLambertMaterial({color: 0x1a1a2e});
let ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Grid
let gridHelper = new THREE.GridHelper(100, 20, 0x444455, 0x222233);
scene.add(gridHelper);

// Player
let playerGroup = new THREE.Group();
playerGroup.position.y = 1;
scene.add(playerGroup);

let playerBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16),
    new THREE.MeshPhongMaterial({color: 0x00ffff})
);
playerGroup.add(playerBody);

let playerHead = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 16),
    new THREE.MeshPhongMaterial({color: 0x00ffff})
);
playerHead.position.y = 1.2;
playerGroup.add(playerHead);

// Gloves
let leftGlove = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 12, 12),
    new THREE.MeshPhongMaterial({color: 0xff5500, emissive: 0xff5500})
);
leftGlove.position.set(-0.5, 0.3, -0.3);
playerGroup.add(leftGlove);

let rightGlove = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 12, 12),
    new THREE.MeshPhongMaterial({color: 0x00aaff, emissive: 0x00aaff})
);
rightGlove.position.set(0.5, 0.3, -0.3);
playerGroup.add(rightGlove);

// Game variables
let playerHealth = 100;
let playerMaxHealth = 100;
let score = 0;
let selectedSpell = 'FIRE';
let spellCooldown = 0;

const SPELL_TYPES = {
    FIRE: { color: 0xff5500, speed: 0.4, damage: 20, range: 35, size: 0.3, name: 'ILDMAGI' },
    FROST: { color: 0x00aaff, speed: 0.3, damage: 15, range: 30, size: 0.25, freezeTime: 100, name: 'FROSTMAGI' },
    LIGHTNING: { color: 0xffff00, speed: 0.5, damage: 30, range: 45, size: 0.2, name: 'LYNNMAGI' }
};

let spells = [];
let enemies = [];

// Enemy class
class Enemy {
    constructor(x, z) {
        this.health = 30;
        this.maxHealth = 30;
        this.speed = 0.1;
        this.frozen = 0;
        
        let geo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 12);
        let mat = new THREE.MeshPhongMaterial({color: 0xff3333});
        this.mesh = new THREE.Mesh(geo, mat);
        this.mesh.position.set(x, 0.6, z);
        scene.add(this.mesh);
        
        let head = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 12, 12),
            new THREE.MeshPhongMaterial({color: 0xff1111})
        );
        head.position.y = 1;
        this.mesh.add(head);
    }
    
    update() {
        if (this.frozen > 0) {
            this.frozen--;
            this.mesh.material.color.set(0x0088ff);
            return;
        }
        
        this.mesh.material.color.set(0xff3333);
        
        let dx = playerGroup.position.x - this.mesh.position.x;
        let dz = playerGroup.position.z - this.mesh.position.z;
        let dist = Math.sqrt(dx*dx + dz*dz);
        
        if (dist > 0.5) {
            this.mesh.position.x += (dx / dist) * this.speed;
            this.mesh.position.z += (dz / dist) * this.speed;
        } else {
            playerHealth -= 3;
        }
    }
    
    takeDamage(damage) {
        this.health -= damage;
    }
    
    freeze() {
        this.frozen = SPELL_TYPES.FROST.freezeTime;
    }
    
    remove() {
        scene.remove(this.mesh);
    }
}

function spawnEnemy() {
    let angle = Math.random() * Math.PI * 2;
    let distance = 35;
    let x = Math.cos(angle) * distance;
    let z = Math.sin(angle) * distance;
    enemies.push(new Enemy(x, z));
}

function castSpell(dirX, dirZ) {
    if (spellCooldown > 0) return;
    
    let spellData = SPELL_TYPES[selectedSpell];
    let spell = new THREE.Mesh(
        new THREE.SphereGeometry(spellData.size, 8, 8),
        new THREE.MeshPhongMaterial({color: spellData.color, emissive: spellData.color})
    );
    
    spell.position.set(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z);
    
    let dist = Math.sqrt(dirX*dirX + dirZ*dirZ);
    spell.velocity = new THREE.Vector3(dirX / dist, 0, dirZ / dist).multiplyScalar(spellData.speed);
    spell.type = selectedSpell;
    spell.damage = spellData.damage;
    spell.range = spellData.range;
    spell.traveled = 0;
    
    scene.add(spell);
    spells.push(spell);
    spellCooldown = 40;
}

function updateGloveColor() {
    let colors = { FIRE: 0xff5500, FROST: 0x00aaff, LIGHTNING: 0xffff00 };
    leftGlove.material.color.set(colors[selectedSpell]);
    leftGlove.material.emissive.set(colors[selectedSpell]);
    rightGlove.material.color.set(colors[selectedSpell]);
    rightGlove.material.emissive.set(colors[selectedSpell]);
}

// Touch controls
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

document.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
});

document.addEventListener('touchmove', (e) => {
    e.preventDefault();
    let deltaX = e.touches[0].clientX - touchStartX;
    let deltaY = e.touches[0].clientY - touchStartY;
    let dist = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
    
    if (dist > 30) {
        let angle = Math.atan2(deltaX, deltaY);
        playerGroup.position.x += Math.sin(angle) * 0.2;
        playerGroup.position.z += Math.cos(angle) * 0.2;
        playerGroup.position.x = Math.max(-40, Math.min(40, playerGroup.position.x));
        playerGroup.position.z = Math.max(-40, Math.min(40, playerGroup.position.z));
    }
});

document.addEventListener('touchend', (e) => {
    if (Date.now() - touchStartTime < 150) {
        let dirX = e.changedTouches[0].clientX - window.innerWidth/2;
        let dirZ = e.changedTouches[0].clientY - window.innerHeight/2;
        castSpell(dirX, dirZ);
    }
});

// Keyboard
document.addEventListener('keydown', (e) => {
    if (e.key === "ArrowLeft") playerGroup.position.x -= 0.5;
    if (e.key === "ArrowRight") playerGroup.position.x += 0.5;
    if (e.key === "ArrowUp") playerGroup.position.z -= 0.5;
    if (e.key === "ArrowDown") playerGroup.position.z += 0.5;
    if (e.key === "1") { selectedSpell = "FIRE"; updateGloveColor(); }
    if (e.key === "2") { selectedSpell = "FROST"; updateGloveColor(); }
    if (e.key === "3") { selectedSpell = "LIGHTNING"; updateGloveColor(); }
    if (e.key === " ") castSpell(0, -1);
});

// Game loop
let spawnTimer = 0;
let spawnRate = 120;

function animate() {
    requestAnimationFrame(animate);
    
    spawnTimer++;
    if (spawnTimer > spawnRate) {
        spawnEnemy();
        spawnTimer = 0;
        spawnRate = Math.max(60, spawnRate - 1);
    }
    
    camera.position.x = playerGroup.position.x * 0.8;
    camera.position.z = playerGroup.position.z + 12;
    camera.lookAt(playerGroup.position);
    
    // Update spells
    for (let i = spells.length - 1; i >= 0; i--) {
        let spell = spells[i];
        spell.position.add(spell.velocity);
        spell.traveled += spell.velocity.length();
        spell.rotation.x += 0.1;
        spell.rotation.y += 0.1;
        
        if (spell.traveled > spell.range) {
            scene.remove(spell);
            spells.splice(i, 1);
            continue;
        }
        
        for (let j = enemies.length - 1; j >= 0; j--) {
            let enemy = enemies[j];
            if (spell.position.distanceTo(enemy.mesh.position) < 1.5) {
                enemy.takeDamage(spell.damage);
                if (spell.type === 'FROST') enemy.freeze();
                if (enemy.health <= 0) {
                    enemy.remove();
                    enemies.splice(j, 1);
                    score += 10;
                }
                scene.remove(spell);
                spells.splice(i, 1);
                break;
            }
        }
    }
    
    enemies.forEach(e => e.update());
    
    spellCooldown = Math.max(0, spellCooldown - 1);
    let percent = Math.round((1 - spellCooldown / 40) * 100);
    document.getElementById('spellCooldown').textContent = `Magi: ${percent}%`;
    document.getElementById('health').style.width = (playerHealth / playerMaxHealth * 100) + '%';
    document.getElementById('score').textContent = `Poeng: ${score}`;
    
    if (playerHealth <= 0) {
        document.getElementById('gameOver').style.display = 'block';
        document.getElementById('finalScore').textContent = `Poeng: ${score}`;
    }
    
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
